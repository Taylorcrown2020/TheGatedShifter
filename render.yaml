databases:
  - name: gatedshifter-db
    databaseName: gatedshifter
    user: gatedshifter
    region: oregon
    # Free Postgres is DELETED 30 days after creation. Anything holding real
    # member records stays on basic-256mb or larger.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: gatedshifter
    runtime: node
    region: oregon # must match the database region to use the internal URL
    plan: starter # paid instance — it does not sleep. Free instances do.
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    domains:
      - www.gatedshifter.co
      - gatedshifter.co
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gatedshifter-db
          property: connectionString
      # Everything public-facing is built from these two.
      - key: SITE_URL
        value: https://www.gatedshifter.co
      - key: CANONICAL_HOST
        value: www.gatedshifter.co
      # Email
      - key: MAIL_FROM_EMAIL
        value: private@gatedshifter.co
      - key: MAIL_FROM_NAME
        value: The Gated Shifter
      - key: MAIL_REPLY_TO
        value: private@gatedshifter.co
      - key: NOTIFY_EMAIL
        value: private@gatedshifter.co
      - key: BREVO_API_KEY
        sync: false # set manually in the dashboard
      - key: BREVO_LIST_ID
        sync: false # numeric id of the Brevo list for marketing opt-ins
      # Admin portal at /admin. Set both of these once to create the first
      # operator account on the next deploy, sign in, then DELETE both keys —
      # the account lives in the database and does not need them again.
      # Password must be at least 12 characters.
      # Further accounts: Render Shell -> npm run admin -- create <email> "<password>"
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Secrets
      - key: IP_HASH_SALT
        generateValue: true
      # Legacy scripted export (GET /api/intake.csv). The /admin portal does
      # not use it. Remove this key to switch that endpoint off entirely.
      - key: ADMIN_EXPORT_TOKEN
        generateValue: true