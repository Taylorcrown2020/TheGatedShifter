databases:
  - name: gatedshifter-db
    databaseName: gatedshifter
    user: gatedshifter
    region: oregon
    # Free Postgres is DELETED 30 days after creation. Use "basic-256mb" or
    # larger for anything holding real inquiries. See README before changing.
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: gatedshifter
    runtime: node
    region: oregon # must match the database region to use the internal URL
    plan: starter # free instances sleep after 15 min of inactivity
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gatedshifter-db
          property: connectionString
      - key: IP_HASH_SALT
        generateValue: true
      - key: ADMIN_EXPORT_TOKEN
        generateValue: true
      - key: BREVO_API_KEY
        sync: false # set manually in the dashboard
      - key: BREVO_LIST_ID
        sync: false