<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gated Shifter — Private Advisory</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           DESIGN TOKENS
           ===================================================== */
        :root {
            --carbon-black: #0B0C0E;
            --heritage-charcoal: #171A1F;
            --slate-gray: #2A2E33;
            --muted-platinum: #BFC3C7;
            --ivory: #EDEBE7;
            --muted-stone: #A7ABB2;
            --aged-brass: #9C7A4A;
            --aged-brass-dim: #6E5A3C;

            --font-headline: 'Cormorant Garamond', 'Adobe Caslon Pro', 'Big Caslon', Georgia, serif;
            --font-body: 'EB Garamond', 'Adobe Caslon Pro', Georgia, serif;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            height: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100%;
            background-color: var(--carbon-black);
            background-image:
                radial-gradient(ellipse 900px 500px at 50% 8%, rgba(156, 122, 74, 0.07), transparent 60%);
            color: var(--ivory);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* =====================================================
           PAGE — full height, centered content, footer pinned
           ===================================================== */
        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 260ms ease-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
        }

        .stage {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        /* =====================================================
           EYEBROW
           ===================================================== */
        .eyebrow {
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--aged-brass);
            margin-bottom: 28px;
        }

        /* =====================================================
           HERO TEXT
           ===================================================== */
        h1 {
            font-family: var(--font-headline);
            font-size: 40px;
            line-height: 1.15;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--ivory);
            margin-bottom: 18px;
        }

        .status {
            font-family: var(--font-body);
            font-style: italic;
            font-size: 16px;
            line-height: 1.7;
            color: var(--muted-stone);
            margin-bottom: 30px;
        }

        .status em {
            font-style: normal;
            color: var(--muted-platinum);
        }

        .rule {
            width: 44px;
            height: 1px;
            background-color: var(--slate-gray);
            margin: 0 auto 30px;
        }

        .contact {
            font-family: var(--font-ui);
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--muted-stone);
        }

        .contact a {
            color: var(--muted-platinum);
            text-decoration: none;
            border-bottom: 1px solid var(--aged-brass-dim);
            padding-bottom: 1px;
            transition: color 160ms ease, border-color 160ms ease;
        }

        .contact a:hover,
        .contact a:focus-visible {
            color: var(--ivory);
            border-color: var(--aged-brass);
        }

        .contact a:focus-visible {
            outline: 2px solid var(--aged-brass);
            outline-offset: 3px;
        }

        /* =====================================================
           FOOTER
           ===================================================== */
        .footer {
            padding: 32px 24px 40px;
            text-align: center;
        }

        .footer__title {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 26px;
            font-weight: 400;
            color: var(--ivory);
            margin-bottom: 4px;
        }

        .footer__meta {
            font-family: var(--font-ui);
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted-platinum);
            margin-bottom: 4px;
        }

        .footer__micro {
            font-family: var(--font-body);
            font-size: 11px;
            line-height: 16px;
            font-weight: 400;
            color: var(--muted-stone);
        }

        /* =====================================================
           TABLET (480px+)
           ===================================================== */
        @media (min-width: 480px) {
            h1 {
                font-size: 48px;
            }

            .status {
                font-size: 17px;
            }
        }

        /* =====================================================
           DESKTOP (992px+)
           ===================================================== */
        @media (min-width: 992px) {
            h1 {
                font-size: 56px;
            }

            .signature {
                width: 152px;
                height: 152px;
            }

            .footer {
                padding: 40px 24px 56px;
            }
        }

        /* =====================================================
           UTILITIES
           ===================================================== */
        @media (prefers-reduced-motion: reduce) {
            .page {
                opacity: 1;
                animation: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">

        <div class="content">
            <div class="stage">

                <p class="eyebrow">Private Advisory</p>

                <h1>The Gated Shifter</h1>

                <p class="status">This site is currently being worked on.</p>

                <div class="rule"></div>

                <p class="contact">For inquiries in the interim,<br><a href="mailto:private@gatedshifter.co">private@gatedshifter.co</a></p>

            </div>
        </div>

        <footer class="footer">
            <p class="footer__title">The Gated Shifter</p>
            <p class="footer__meta">Private Advisory</p>
            <p class="footer__micro">Discreet inquiries by introduction.</p>
        </footer>

    </main>
</body>
</html>
